name: Deploy editor to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['editor/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare editor
        run: |
          mkdir _site
          cp editor/static/index.html editor/static/pedal.js editor/static/convert-worker.js editor/static/stomp_convert.wasm _site/
          cp editor/catalog.json _site/catalog.json
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
