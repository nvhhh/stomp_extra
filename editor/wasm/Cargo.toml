[package]
name = "stomp-convert"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "open-stomp's NAM and IR converters as a dependency-free WebAssembly module for the browser editor"

[lib]
crate-type = ["cdylib"]
path = "lib.rs"

[dependencies]
# Fetched and patched by tools/build_converter_wasm.py (single-threaded optimiser for wasm32).
open-stomp = { path = "../../work/open-stomp-src", default-features = false, features = ["nam"] }
# open-stomp's FFT; wasm_simd uses WebAssembly SIMD (Chrome / Edge / Firefox / Safari since 2021).
rustfft = { version = "6.4", features = ["wasm_simd"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
